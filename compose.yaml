services:
  web:
    image: ghcr.io/mepkn/electricity-bill-calculator:0000000000000000000000000000000000000000
    container_name: electricity-bill
    restart: unless-stopped
    ports:
      - "127.0.0.1:5330:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
